[project]
name = "assistente-ia"
version = "1.0.0"
description = "Curso FIA - Engenharia de Inteligência Artificial: template para fork dos alunos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    # Núcleo do curso (versões verificadas no PyPI em out/2026)
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "langgraph==1.2.16",
    "deepagents==0.7.29",
    # Apoio (versões exatas travadas no uv.lock)
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rich>=13.0",
    "langchain-mcp-adapters>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistente_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["openai: chama a API real da OpenAI (pulado quando não há chave)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"aulas/**/*.py" = ["E402"]
"projeto_final/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["assistente_ia"]
